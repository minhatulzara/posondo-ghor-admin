<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posondo Ghor | Admin Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f4f9;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 40px 32px;
    border-radius: 16px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo h1 {
    color: #172554;
    font-size: 27px;
}

.logo p {
    color: #64748b;
    margin-top: 8px;
    font-size: 14px;
}

h2 {
    color: #1e293b;
    font-size: 22px;
    margin-bottom: 8px;
}

.subtitle {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 16px 0 8px;
    color: #334155;
    font-size: 14px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #2563eb;
}

button {
    width: 100%;
    padding: 14px;
    background: #1d4ed8;
    color: white;
    border: none;
    border-radius: 8px;
    margin-top: 24px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1e40af;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

#message {
    margin-top: 15px;
    font-size: 14px;
    text-align: center;
    line-height: 1.5;
}

.footer {
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>POSONDO GHOR</h1>
        <p>Administration Portal</p>
    </div>

    <h2>Welcome Back!</h2>
    <p class="subtitle">Login to manage your online store.</p>

    <form id="loginForm">

        <label for="email">Email Address</label>
        <input type="email" id="email"
               placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password"
               placeholder="Enter your password" required>

        <button type="submit" id="loginBtn">Sign In</button>

        <p id="message"></p>

    </form>

    <div class="footer">
        © 2026 Posondo Ghor. All rights reserved.
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyAitvla6I6Ch2ec4iiUEaqW4_5sWkZQVpU",
    authDomain: "posondo-ghor-admin.firebaseapp.com",
    projectId: "posondo-ghor-admin",
    storageBucket: "posondo-ghor-admin.firebasestorage.app",
    messagingSenderId: "434962480525",
    appId: "1:434962480525:web:60c07fb54223eaefa251c4",
    measurementId: "G-NTKSZ5TTDW"
};

const ADMIN_UID = "Ke33F93Pz0UzfJiFLOKo24yde623";

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginBtn.disabled = true;
    loginBtn.textContent = "Signing in...";
    message.style.color = "#64748b";
    message.textContent = "Please wait...";

    try {

        const result = await auth.signInWithEmailAndPassword(
            email,
            password
        );

        if (result.user.uid !== ADMIN_UID) {
            await auth.signOut();
            throw new Error("You are not authorized as Admin.");
        }

        message.style.color = "green";
        message.textContent = "Login successful!";

        window.location.href = "dashboard.html";

    } catch(error) {

        message.style.color = "red";

        if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found"
        ) {
            message.textContent = "Incorrect email or password.";
        } else {
            message.textContent = error.message;
        }

        loginBtn.disabled = false;
        loginBtn.textContent = "Sign In";

    }

});

</script>

</body>
</html>
